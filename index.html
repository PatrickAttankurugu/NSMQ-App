<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSMQ Quiz App - Code++</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-panel">
        <h1 class="main-title">Welcome to NSMQ Prep</h1>
        <div class="container">
            <div class="panel">
                <h2 class="subtitle">by Code++</h2>
                <button class="start-btn" onclick="startQuiz()">Start Quiz</button>
                <div id="quiz-section" class="quiz-section">
                    <h2 id="question"></h2>
                    <div class="controls">
                        <button class="control-btn" onclick="askQuestion()">Start Question</button>
                        <button class="control-btn" onclick="submitAnswer()">Answer</button>
                    </div>
                    <p id="response"></p>
                </div>
            </div>
        </div>
    </div>
    <div id="answer-popup" class="popup">
        <div class="popup-content">
            <span class="close" onclick="closePopup()">&times;</span>
            <p>Speak your answer now...</p>
            <input type="text" id="popup-answer" placeholder="Type your answer">
            <button class="submit-popup-btn" onclick="processAnswer()">Submit Answer</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
